<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>伊勢志摩旅遊地圖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 只有標題、日期、數字用網頁字型（圓體，T47）；內文是系統字。字型的 CSS 不擋第一次繪製：載完才套用（media 的寫法），在那之前是系統字（T32）。
         Noto Sans TC 只補 Zen Maru Gothic 缺的繁中字，只要 700（標題的 900 也用它） -->
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+TC:wght@700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- 開機骨架（T32）：JS、CSS 都還沒到就畫得出來，App 有結果才拿掉（lib/bootSkeleton.ts）。版面對齊手機的探索分頁（T39 起進網站先看探索）、網頁的三欄（1100px 分界同 DESKTOP_QUERY） -->
    <style>
      html, body { margin: 0; height: 100%; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; background: #e8ecf1; overflow: hidden; }
      #boot i { display: block; border-radius: 999px; background: #e3e7ef; animation: boot-pulse 1.4s ease-in-out infinite; }
      #boot .b-chat, #boot .b-side { display: none; }
      #boot .b-map { display: none; flex: 1 1 auto; min-height: 0; }
      #boot .b-panel { flex: 1 1 auto; min-height: 0; background: #fff; overflow: hidden; }
      #boot .b-wall { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
      #boot .b-wall i { height: 188px; border-radius: 14px; }
      #boot .b-head { height: 64px; background: #24468a; }
      #boot .b-rows { padding: 14px 16px; display: grid; gap: 14px; }
      #boot .b-row { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
      #boot .b-row > i { height: 64px; border-radius: 14px; }
      #boot .b-line { display: grid; gap: 8px; }
      #boot .b-line i { height: 12px; }
      #boot .b-line i:last-child { width: 60%; }
      #boot .b-tabs { flex: 0 0 auto; height: calc(56px + env(safe-area-inset-bottom)); box-sizing: border-box; padding: 14px 8% env(safe-area-inset-bottom); background: #fff; border-top: 1px solid #e6e8ee; display: flex; justify-content: space-between; }
      #boot .b-tabs i { width: 28px; height: 28px; border-radius: 50%; }
      @media (min-width: 1100px) {
        #boot { flex-direction: row; }
        #boot .b-tabs, #boot .b-panel { display: none; }
        #boot .b-map { display: block; }
        #boot .b-chat { display: block; flex: 0 0 260px; background: #fff; border-right: 1px solid #e6e8ee; }
        #boot .b-side { display: block; flex: 0 0 360px; background: #fff; border-left: 1px solid #e6e8ee; }
      }
      /* 欄寬同 styles.css 的 .layout.desktop（--ai-w、--side-w） */
      @media (min-width: 1280px) { #boot .b-chat { flex-basis: 300px; } #boot .b-side { flex-basis: 420px; } }
      @media (min-width: 1440px) { #boot .b-chat { flex-basis: 340px; } #boot .b-side { flex-basis: 460px; } }
      @media (min-width: 1680px) { #boot .b-chat { flex-basis: 380px; } #boot .b-side { flex-basis: 520px; } }
      @keyframes boot-pulse { 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { #boot i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="載入中">
      <div class="b-chat"><div class="b-head"></div></div>
      <div class="b-map"></div>
      <div class="b-side">
        <div class="b-head"></div>
        <div class="b-rows">
          <div class="b-row"><i></i><div class="b-line"><i></i><i></i></div></div>
          <div class="b-row"><i></i><div class="b-line"><i></i><i></i></div></div>
          <div class="b-row"><i></i><div class="b-line"><i></i><i></i></div></div>
          <div class="b-row"><i></i><div class="b-line"><i></i><i></i></div></div>
        </div>
      </div>
      <div class="b-panel">
        <div class="b-head"></div>
        <div class="b-wall"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="b-tabs"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
